# Builds the Ninho Windows installer (x64): the Element Desktop Electron wrapper
# bundling this fork's web app, with the config in apps/desktop/ninho/.
#
# Two jobs, mirroring the upstream pipeline: a Linux job builds the webapp
# (the full workspace install works there, unlike on Windows, where pnpm fails
# to run the `prepare` script of the matrix-js-sdk git dependency), and a
# Windows job downloads the webapp and packages the installer (electron-builder
# must run on the OS it targets, and the native modules have to match).
#
# - workflow_dispatch: builds and uploads the installer as a workflow artifact.
# - pushing a `ninho-v*` tag: also creates a GitHub release with the installer,
#   using the tag as the app version (tag must be `ninho-v` + valid semver,
#   e.g. ninho-v1.12.32, because Squirrel parses it as semver).
#
# The build is unsigned, so Windows SmartScreen will warn on first launch
# ("More info" -> "Run anyway").

name: Build Ninho Windows installer

on:
    workflow_dispatch:
    push:
        tags:
            - "ninho-v*"

permissions:
    contents: write # required to create the release and upload the installer

defaults:
    run:
        shell: bash

jobs:
    webapp:
        name: Build web app
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  cache: true
                  install: false

            - name: Determine version
              run: |
                  if [[ $GITHUB_REF_NAME == ninho-v* ]]; then
                      echo "VERSION=${GITHUB_REF_NAME#ninho-v}" >> "$GITHUB_ENV"
                  else
                      echo "VERSION=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_ENV"
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              # No browsers needed: this workflow never runs Playwright.
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

            - name: Build web app
              working-directory: apps/web
              # `pnpm build` runs nx build, whose ^build dependency chain produces
              # packages/shared-components/dist (web-shared-components' exports point
              # there, so raw webpack-cli would fail on a clean checkout).
              run: pnpm run build
              env:
                  VERSION: ${{ env.VERSION }}

            - name: Package webapp
              working-directory: apps/web
              # Drop any local config.json: the Windows job injects the Ninho config.
              run: |
                  rm -f webapp/config.json
                  mkdir -p dist
                  tar -czf dist/webapp.tar.gz webapp

            - name: Upload webapp artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: ninho-webapp
                  path: apps/web/dist/webapp.tar.gz
                  retention-days: 3
                  if-no-files-found: error

    installer:
        name: Build Windows x64 installer
        runs-on: windows-latest
        needs: webapp
        steps:
            # Tweak line endings to make nx happy, workaround for https://github.com/nrwl/nx/issues/35828
            - name: Configure git line endings
              run: |
                  git config --system core.autocrlf false
                  git config --system core.eol lf

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Download webapp
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: ninho-webapp
                  path: apps/web/dist/

            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: true
                  install: false

            - name: Determine version
              run: |
                  if [[ $GITHUB_REF_NAME == ninho-v* ]]; then
                      echo "VERSION=${GITHUB_REF_NAME#ninho-v}" >> "$GITHUB_ENV"
                  else
                      echo "VERSION=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_ENV"
                  fi

            - name: Disable pnpm auto-install before scripts
              # pnpm 12 re-verifies node_modules before every `pnpm run` and, on
              # mismatch, runs a full workspace install that includes apps/web's
              # matrix-js-sdk git dependency, whose prepare script fails on Windows.
              # The installer build only needs the filtered install below.
              run: pnpm config set --location project verifyDepsBeforeRun false

            - name: Install desktop dependencies
              working-directory: apps/desktop
              # Filtered install like the upstream Windows job: this skips the root
              # postinstall and apps/web's git dependencies, whose prepare script
              # breaks pnpm on Windows.
              run: pnpm install --frozen-lockfile --filter element-desktop

            - name: Bundle webapp into the desktop wrapper
              working-directory: apps/desktop
              # The installer version comes from the VERSION env var in the build
              # step (electron-builder reads it), so no set-version.ts needed here.
              run: |
                  tar -xzf ../web/dist/webapp.tar.gz -C ../web/
                  cp -r ../web/webapp webapp
                  cp ninho/config.json webapp/config.json
                  pnpm run asar-webapp
                  cp ninho/build.json variant.json

            - name: Build installer
              working-directory: apps/desktop
              run: pnpm run build --publish never -w squirrel
              env:
                  VARIANT_PATH: variant.json
                  VERSION: ${{ env.VERSION }}

            - name: Upload installer artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: ninho-windows-x64
                  path: apps/desktop/dist/squirrel-windows*/*Setup*.exe
                  if-no-files-found: error

            - name: Create release, attach installer and publish update feed
              if: startsWith(github.ref, 'refs/tags/ninho-v')
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: |
                  cd apps/desktop/dist/squirrel-windows*/

                  # Squirrel fetches win32/x64/RELEASES from the update feed and downloads the
                  # nupkg from the absolute URL in the entry (Squirrel's ReleaseEntry parser
                  # supports absolute HTTP URLs in the filename field).
                  NUPKG=$(ls *-full.nupkg)
                  SHA1=$(sha1sum "$NUPKG" | cut -d' ' -f1)
                  SIZE=$(stat -c%s "$NUPKG")
                  echo "$SHA1 https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$NUPKG $SIZE" > RELEASES

                  gh release create "$GITHUB_REF_NAME" \
                      --title "Ninho ${GITHUB_REF_NAME#ninho-}" \
                      --generate-notes \
                      "$NUPKG" *Setup*.exe

                  # Publish the feed on the ninho-update branch: raw.githubusercontent serves it
                  # at ${update_base_url}win32/x64/RELEASES (update_base_url is baked into the
                  # bundled Ninho config).
                  if ! git ls-remote --heads origin ninho-update | grep -q .; then
                      DEFAULT_SHA=$(gh api "repos/$REPO/git/ref/heads/develop" --jq .object.sha)
                      gh api --method POST "repos/$REPO/git/refs" -f ref=refs/heads/ninho-update -f sha="$DEFAULT_SHA"
                  fi
                  FEED_SHA=$(gh api "repos/$REPO/contents/win32/x64/RELEASES?ref=ninho-update" --jq .sha 2>/dev/null || true)
                  ARGS=(--method PUT "repos/$REPO/contents/win32/x64/RELEASES" -f message="Ninho update feed $GITHUB_REF_NAME" -f content="$(base64 -w0 RELEASES)" -f branch=ninho-update)
                  if [ -n "$FEED_SHA" ]; then
                      ARGS+=(-f sha="$FEED_SHA")
                  fi
                  gh api "${ARGS[@]}"
